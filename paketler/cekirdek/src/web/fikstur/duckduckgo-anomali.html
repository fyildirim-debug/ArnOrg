<!DOCTYPE html>
<html lang="en-US">
<head><meta charset="utf-8"><title>DuckDuckGo</title><link rel="stylesheet" href="/dist/a.css"></head>
<body>
<!-- DuckDuckGo'nun bot doğrulama (anomaly) sayfasının bilinen biçimi; motor bunu CAPTCHA sayar -->
<div class="anomaly-modal__mask">
  <div class="anomaly-modal__modal" data-testid="anomaly-modal">
    <div class="anomaly-modal__title">Unfortunately, bots use DuckDuckGo too.</div>
    <div class="anomaly-modal__description">Please complete the following challenge to confirm this search was made by a human.</div>
    <form id="challenge-form" action="//duckduckgo.com/anomaly.js?sv=html&amp;cc=sre" method="POST">
      <div class="anomaly-modal__puzzle"></div>
      <input type="hidden" name="challenge_id" value="abc123">
      <button type="submit" class="anomaly-modal__submit">Submit</button>
    </form>
  </div>
</div>
</body>
</html>
