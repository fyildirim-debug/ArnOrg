<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>ArnOrg</title>
    <style>
      :root {
        --murekkep: #0a0a0b;
        --murekkep-2: #111113;
        --cizgi: #26262a;
        --kagit: #f2f0ec;
        --soluk: #8d8a85;
        --mercan: oklch(0.72 0.19 25);
        --baslik: "Anton", "Bebas Neue", "Oswald", "Impact", "Haettenschweiler", "Arial Narrow Bold",
          "Liberation Sans Narrow", "DejaVu Sans Condensed", sans-serif;
        --es: "IBM Plex Mono", ui-monospace, "Cascadia Mono", "Consolas", "DejaVu Sans Mono", "Liberation Mono",
          monospace;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--murekkep);
        color: var(--kagit);
        font: 13px/1.5 var(--es);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
        border: 1px solid var(--cizgi);
      }
      header {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 8px 0 18px;
        border-bottom: 1px solid var(--cizgi);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--soluk);
      }
      header .isaret {
        width: 10px;
        height: 10px;
        background: var(--mercan);
      }
      header .ad {
        color: var(--kagit);
      }
      header .bosluk {
        flex: 1;
      }
      header button.kapat {
        -webkit-app-region: no-drag;
        width: 28px;
        height: 28px;
        border: 0;
        background: transparent;
        color: var(--soluk);
        font: 16px/1 var(--es);
        cursor: pointer;
      }
      header button.kapat:hover {
        color: var(--kagit);
        background: var(--murekkep-2);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 26px 28px 22px;
        min-height: 0;
      }
      h1 {
        font: 400 64px/0.9 var(--baslik);
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .asama {
        margin-top: 14px;
        color: var(--mercan);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .aciklama {
        margin-top: 6px;
        color: var(--soluk);
        white-space: pre-wrap;
        user-select: text;
      }
      .serit {
        position: relative;
        margin-top: auto;
        height: 3px;
        background: var(--cizgi);
        overflow: hidden;
      }
      .serit::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 30%;
        height: 100%;
        background: var(--mercan);
        animation: kay 1.1s ease-in-out infinite alternate;
      }
      @keyframes kay {
        to {
          left: 70%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .serit::after {
          animation: none;
          width: 100%;
        }
      }
      footer {
        margin-top: 14px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--soluk);
      }

      /* Hata durumu */
      .hata-alani {
        display: none;
      }
      body[data-asama="hata"] .hata-alani {
        display: flex;
      }
      body[data-asama="hata"] .serit,
      body[data-asama="hata"] footer {
        display: none;
      }
      body[data-asama="hata"] h1 {
        color: var(--mercan);
        font-size: 56px;
      }
      body[data-asama="hata"] .asama {
        color: var(--soluk);
      }
      body[data-asama="hata"] .aciklama {
        color: var(--kagit);
      }
      .hata-alani {
        flex: 1;
        flex-direction: column;
        min-height: 0;
        margin-top: 18px;
      }
      .kayit-baslik {
        display: flex;
        gap: 12px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--soluk);
        margin-bottom: 6px;
      }
      .kayit-baslik span:last-child {
        text-transform: none;
        letter-spacing: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
      }
      pre {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 12px 14px;
        background: var(--murekkep-2);
        border: 1px solid var(--cizgi);
        font: 12px/1.45 var(--es);
        color: #c9c6c0;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
      }
      .dugmeler {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .dugmeler button {
        height: 38px;
        padding: 0 18px;
        border: 1px solid var(--cizgi);
        background: transparent;
        color: var(--kagit);
        font: 12px/1 var(--es);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .dugmeler button:hover {
        border-color: var(--kagit);
      }
      .dugmeler button.birincil {
        background: var(--mercan);
        border-color: var(--mercan);
        color: var(--murekkep);
      }
      .dugmeler button.birincil:hover {
        background: var(--kagit);
        border-color: var(--kagit);
      }
      .dugmeler button:focus-visible {
        outline: 2px solid var(--kagit);
        outline-offset: 2px;
      }
      .dugmeler .bosluk {
        flex: 1;
      }
    </style>
  </head>
  <body data-asama="baslatiliyor">
    <header>
      <span class="isaret"></span>
      <span class="ad">ArnOrg</span>
      <span id="surum"></span>
      <span class="bosluk"></span>
      <button class="kapat" data-eylem="cik" title="Çık" aria-label="Çık">×</button>
    </header>
    <main>
      <h1 id="baslik">ArnOrg</h1>
      <p class="asama" id="asama">Çekirdek başlatılıyor</p>
      <p class="aciklama" id="aciklama"></p>
      <div class="serit" role="progressbar" aria-label="Başlatılıyor"></div>
      <footer>Claude Code ajanlarından kurulan yazılım şirketi</footer>
      <section class="hata-alani">
        <div class="kayit-baslik"><span>Kayıt</span><span id="kayit-dosyasi"></span></div>
        <pre id="kuyruk"></pre>
        <div class="dugmeler">
          <button class="birincil" data-eylem="yeniden-baslat">Yeniden başlat</button>
          <button data-eylem="kayitlari-ac">Kayıt klasörünü aç</button>
          <span class="bosluk"></span>
          <button data-eylem="cik">Çık</button>
        </div>
      </section>
    </main>
    <script src="durum.js"></script>
  </body>
</html>
