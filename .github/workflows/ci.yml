# Sürekli tümleştirme: main'e her gönderimde ve çekme isteğinde Windows ve Linux'ta
# tip denetimi, testler ve derleme; Linux'ta ayrıca masaüstü kabuğunun duman testi.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  denetim:
    name: Denetim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip denetimi
        run: npm run typecheck

      - name: Testler
        run: npm test

      - name: Derleme (Stüdyo + çekirdek)
        run: npm run build

      - name: Derleme (masaüstü kabuğu)
        run: npm run build -w @arnorg/masaustu

  masaustu-duman:
    name: Masaüstü duman testi (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Masaüstü kabuğunu derle
        run: npm run build -w @arnorg/masaustu

      # Sahte çekirdekle açılır: çekirdek utilityProcess içinde başlar, yerel bağımlılıklar
      # (better-sqlite3, node-pty, claude ikilisi) denenir, ana pencere yüklenince ekran görüntüsü
      # alınır ve uygulama nazikçe kapanır. Çekirdek durursa çıkış kodu 1 olur.
      # GitHub koşucularında kullanıcı ad alanları kısıtlı olduğundan --no-sandbox gerekir.
      - name: Sahte çekirdekle aç
        env:
          ARNORG_SAHTE_CEKIRDEK: "1"
          ARNORG_KULLANICI_DIZINI: ${{ runner.temp }}/arnorg
          ARNORG_DENEME_EKRAN_GORUNTUSU: ${{ runner.temp }}/arnorg/ana-pencere.png
        run: |
          mkdir -p "$ARNORG_KULLANICI_DIZINI"
          timeout 120 xvfb-run -a npx electron paketler/masaustu --no-sandbox
          test -s "$ARNORG_DENEME_EKRAN_GORUNTUSU"

      - name: Ekran görüntüsü ve kayıt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masaustu-duman
          path: |
            ${{ runner.temp }}/arnorg/ana-pencere.png
            ${{ runner.temp }}/arnorg/logs/
          if-no-files-found: ignore
