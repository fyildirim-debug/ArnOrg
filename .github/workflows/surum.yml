# Sürüm: v* etiketinde Windows ve Linux paketleri üretilir, taslak GitHub sürümüne eklenir.
# Her mimari kendi koşucusunda paketlenir (npm yalnız o makinenin yerel paketlerini kurar).
#
# Elle çalıştırma (workflow_dispatch) yalnız paketleri üretir, sürüm açmaz.
name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paketle:
    name: Paketle (${{ matrix.ad }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: windows-x64
            os: windows-latest
            hedef: --win --x64
          - ad: linux-x64
            os: ubuntu-latest
            hedef: --linux --x64
          # Arm64 Linux koşucusu açık depolarda ücretsizdir; özel depoda kullanılamıyorsa bu satırı kaldırın.
          - ad: linux-arm64
            os: ubuntu-24.04-arm
            hedef: --linux --arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: rpm aracı
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Bağımlılıklar
        run: npm ci

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}" -w @arnorg/masaustu

      - name: Derleme (Stüdyo + çekirdek)
        run: npm run build

      # TODO imzalama: sertifika depo sırlarına eklenince bu adıma env olarak verin; depoya sertifika konmaz.
      #   Windows (Authenticode): CSC_LINK = .pfx dosyasının base64'ü ya da https adresi,
      #                           CSC_KEY_PASSWORD = parolası (ör. ${{ secrets.WIN_CSC_LINK }}).
      #   İmza bilgisi yoksa electron-builder imzasız paketler.
      - name: Paketle
        shell: bash
        run: npm run paketle -w @arnorg/masaustu -- ${{ matrix.hedef }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: arnorg-${{ matrix.ad }}
          path: |
            paketler/masaustu/cikti/*.exe
            paketler/masaustu/cikti/*.msi
            paketler/masaustu/cikti/*.AppImage
            paketler/masaustu/cikti/*.deb
            paketler/masaustu/cikti/*.rpm
            paketler/masaustu/cikti/*.blockmap
            paketler/masaustu/cikti/latest*.yml
          if-no-files-found: error
          compression-level: 0

  yayinla:
    name: Taslak sürüm
    needs: paketle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true

      - name: Dosyalar
        run: ls -la paketler

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ArnOrg ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: paketler/*
