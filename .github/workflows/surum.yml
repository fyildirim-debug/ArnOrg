# Sürüm: Windows ve Linux paketleri üretilir ve GitHub sürümü olarak yayınlanır.
# Her mimari kendi koşucusunda paketlenir (npm yalnız o makinenin yerel paketlerini kurar).
#
# Sürüm çıkarma: npm run surum -- <sürüm>, docs/surumler/v<sürüm>.md notları, commit; sonra
#   - v<sürüm> etiketini gönderin, ya da
#   - Actions → Sürüm → Run workflow ile "surum" alanına v<sürüm> yazın: etiket seçilen dalın
#     son commit'ine sürümle birlikte konur.
# Etiket paket sürümleriyle uyuşmazsa ya da notlar yoksa paketleme başlamadan durur
# (betikler/surum.mjs --denetle). "surum" boş bırakılırsa yalnız paketler yapıt olarak üretilir.
#
# Otomatik güncelleme: kurulu uygulamalar güncellemeleri bu açık kaynak deposunun sürümlerinden okur
# (paketler/masaustu/electron-builder.yml → publish). Sürüm yayınlanınca latest*.yml ve kurulum dosyaları
# buraya yüklenir; ayrı bir depo gerekmez.
#
# Windows imzası (isteğe bağlı): depo değişkeni WIN_IMZA sağlayıcıyı seçer (sslcom, digicert ya da komut) ve
# sağlayıcının sırları tanımlıysa Windows paketleri imzalanır (paketler/masaustu/betikler/imzala.cjs); WIN_IMZA
# boşsa paketler imzasız çıkar. Ayrıntı: paketler/masaustu/README.md → "İmzalama".
name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      surum:
        description: "Yayınlanacak sürüm etiketi (ör. v0.0.2); boş: yalnız paketler"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Etiket gönderiminde etiketin adı, elle çalıştırmada girilen sürüm
  SURUM_ETIKETI: ${{ github.event_name == 'push' && github.ref_name || inputs.surum }}

concurrency:
  group: surum-${{ github.event_name == 'push' && github.ref_name || inputs.surum || github.run_id }}
  cancel-in-progress: false

jobs:
  paketle:
    name: Paketle (${{ matrix.ad }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: windows-x64
            os: windows-latest
            hedef: --win --x64
          - ad: linux-x64
            os: ubuntu-latest
            hedef: --linux --x64
          # Arm64 Linux koşucusu (ubuntu-24.04-arm) açık depolarda ücretsiz, 2026'dan beri özel depolarda da var;
          # kullanılamazsa bu satırı kaldırın, yoksa iş kuyrukta bekler ve sürüm açılmaz.
          - ad: linux-arm64
            os: ubuntu-24.04-arm
            hedef: --linux --arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Etiket, paket sürümleri ve sürüm notları
        if: env.SURUM_ETIKETI != ''
        shell: bash
        run: node betikler/surum.mjs --denetle "$SURUM_ETIKETI"

      - name: rpm aracı
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Bağımlılıklar
        run: npm ci

      - name: Derleme (Stüdyo + çekirdek)
        run: npm run build

      # İmza aracı: SSL.com eSigner'ın CodeSignTool'u (Windows paketi kendi Java'sıyla gelir)
      - name: İmza aracı (SSL.com eSigner)
        if: runner.os == 'Windows' && vars.WIN_IMZA == 'sslcom'
        shell: pwsh
        env:
          CODESIGNTOOL_SURUMU: ${{ vars.CODESIGNTOOL_SURUMU || 'v1.3.2' }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "codesigntool.zip"
          $dizin = Join-Path $env:RUNNER_TEMP "codesigntool"
          Invoke-WebRequest "https://github.com/SSLcom/CodeSignTool/releases/download/$env:CODESIGNTOOL_SURUMU/CodeSignTool-$env:CODESIGNTOOL_SURUMU-windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dizin -Force
          $bat = Get-ChildItem $dizin -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          if (-not $bat) { throw "CodeSignTool.bat bulunamadı" }
          "CODESIGNTOOL_DIZINI=$($bat.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # İmza aracı: DigiCert KeyLocker araçları (smctl); istemci sertifikası base64 sırdan dosyaya yazılır
      - name: İmza aracı (DigiCert KeyLocker)
        if: runner.os == 'Windows' && vars.WIN_IMZA == 'digicert'
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          $p12 = Join-Path $env:RUNNER_TEMP "digicert-istemci.p12"
          [IO.File]::WriteAllBytes($p12, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
          "SM_CLIENT_CERT_FILE=$p12" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $msi = Join-Path $env:RUNNER_TEMP "Keylockertools-windows-x64.msi"
          Invoke-WebRequest "https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download" -Headers @{ "x-api-key" = $env:SM_API_KEY } -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/qn" -Wait
          $smctl = Get-ChildItem "C:\Program Files\DigiCert" -Recurse -Filter smctl.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $smctl) { throw "smctl.exe bulunamadı" }
          $smctl.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Paketle
        if: runner.os != 'Windows'
        shell: bash
        run: npm run paketle -w @arnorg/masaustu -- ${{ matrix.hedef }} --publish never

      # Sırlar yalnız Windows paketleme adımına verilir; WIN_IMZA boşsa kanca bir şey yapmaz
      - name: Paketle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARNORG_IMZA: ${{ vars.WIN_IMZA }}
          ARNORG_IMZA_KOMUTU: ${{ vars.WIN_IMZA_KOMUTU }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
        run: npm run paketle -w @arnorg/masaustu -- ${{ matrix.hedef }} --publish never

      - name: İmza denetimi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_IMZA: ${{ vars.WIN_IMZA }}
        run: |
          $dosyalar = Get-ChildItem paketler/masaustu/cikti -File | Where-Object { $_.Extension -in ".exe", ".msi" }
          if (-not $env:WIN_IMZA) {
            "::notice title=İmza::WIN_IMZA tanımlı değil; Windows paketleri imzasız yayınlanır."
            exit 0
          }
          $imzasiz = $dosyalar | Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne "Valid" }
          if ($imzasiz) { throw "İmzası geçersiz dosyalar: $($imzasiz.Name -join ', ')" }
          $dosyalar | ForEach-Object { "$($_.Name): $((Get-AuthenticodeSignature -LiteralPath $_.FullName).SignerCertificate.Subject)" }

      - uses: actions/upload-artifact@v4
        with:
          name: arnorg-${{ matrix.ad }}
          path: |
            paketler/masaustu/cikti/*.exe
            paketler/masaustu/cikti/*.msi
            paketler/masaustu/cikti/*.AppImage
            paketler/masaustu/cikti/*.deb
            paketler/masaustu/cikti/*.rpm
            paketler/masaustu/cikti/*.blockmap
            paketler/masaustu/cikti/latest*.yml
          if-no-files-found: error
          compression-level: 0

  yayinla:
    name: Sürümü yayınla
    needs: paketle
    if: github.event_name == 'push' || inputs.surum != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Yalnız sürüm notları gerekir
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/surumler

      - uses: actions/download-artifact@v4
        with:
          path: cikti
          merge-multiple: true

      - name: Dosyalar
        run: ls -la cikti

      # Etiket yoksa (elle çalıştırma) sürümle birlikte bu commit'e konur
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SURUM_ETIKETI }}
          target_commitish: ${{ github.sha }}
          name: ArnOrg ${{ env.SURUM_ETIKETI }}
          body_path: docs/surumler/${{ env.SURUM_ETIKETI }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: cikti/*
