# Sürüm: v* etiketinde Windows ve Linux paketleri üretilir ve GitHub sürümü olarak yayınlanır.
# Her mimari kendi koşucusunda paketlenir (npm yalnız o makinenin yerel paketlerini kurar).
#
# Sürüm çıkarma: npm run surum -- <sürüm>, docs/surumler/v<sürüm>.md notları, commit,
# git tag -a v<sürüm> ve etiketi gönderme. Etiket paket sürümleriyle uyuşmazsa ya da notlar
# yoksa paketleme başlamadan durur (betikler/surum.mjs --denetle).
#
# Elle çalıştırma (workflow_dispatch) yalnız paketleri üretir, sürüm açmaz.
name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paketle:
    name: Paketle (${{ matrix.ad }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: windows-x64
            os: windows-latest
            hedef: --win --x64
          - ad: linux-x64
            os: ubuntu-latest
            hedef: --linux --x64
          # Arm64 Linux koşucusu (ubuntu-24.04-arm) açık depolarda ücretsiz, 2026'dan beri özel depolarda da var;
          # kullanılamazsa bu satırı kaldırın, yoksa iş kuyrukta bekler ve sürüm açılmaz.
          - ad: linux-arm64
            os: ubuntu-24.04-arm
            hedef: --linux --arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Etiket, paket sürümleri ve sürüm notları
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node betikler/surum.mjs --denetle "$GITHUB_REF_NAME"

      - name: rpm aracı
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Bağımlılıklar
        run: npm ci

      - name: Derleme (Stüdyo + çekirdek)
        run: npm run build

      # TODO imzalama: sertifika depo sırlarına eklenince bu adıma env olarak verin; depoya sertifika konmaz.
      #   Windows (Authenticode): CSC_LINK = .pfx dosyasının base64'ü ya da https adresi,
      #                           CSC_KEY_PASSWORD = parolası (ör. ${{ secrets.WIN_CSC_LINK }}).
      #   İmza bilgisi yoksa electron-builder imzasız paketler.
      - name: Paketle
        shell: bash
        run: npm run paketle -w @arnorg/masaustu -- ${{ matrix.hedef }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: arnorg-${{ matrix.ad }}
          path: |
            paketler/masaustu/cikti/*.exe
            paketler/masaustu/cikti/*.msi
            paketler/masaustu/cikti/*.AppImage
            paketler/masaustu/cikti/*.deb
            paketler/masaustu/cikti/*.rpm
            paketler/masaustu/cikti/*.blockmap
            paketler/masaustu/cikti/latest*.yml
          if-no-files-found: error
          compression-level: 0

  yayinla:
    name: Sürümü yayınla
    needs: paketle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Yalnız sürüm notları gerekir
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/surumler

      - uses: actions/download-artifact@v4
        with:
          path: cikti
          merge-multiple: true

      - name: Dosyalar
        run: ls -la cikti

      - uses: softprops/action-gh-release@v2
        with:
          name: ArnOrg ${{ github.ref_name }}
          body_path: docs/surumler/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: cikti/*
